<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <title>Document</title>
    </head>
    <body>
        <button type="button" id="startAddition" class="option menu">Plus</button>
        <button type="button" id="startSubtraction" class="option menu">Minus</button>

        <label id="medium" class="option menu">Medium
            <input type="checkbox">
        </label>
        <label id="hard" class="option menu">Hard
            <input type="checkbox">
        </label>
        
        <h1 id="gameInfo">
            <p id="score" class="game">Score: </p>
            <p id="time" class="game">5:00</p>
        </h1>

        <p id="question" class="game">15 + 4</p>

        <form id = "answerForm" class="game">
            <input type="text" id="answer">
        </form>

        <div id="resultBox" class="game"></div>
    </body>

    <script src="main.js"></script>
</html>
